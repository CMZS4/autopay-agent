<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AutoPay Agent</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .header h1 span { color: #a78bfa; }

    .header p {
      color: #444;
      font-size: 0.75rem;
      margin-top: 6px;
    }

    .badge {
      display: inline-block;
      background: #111;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.7rem;
      color: #34d399;
      margin-top: 10px;
    }

    .chat {
      width: 100%;
      max-width: 620px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 16px;
      padding: 24px;
      height: 420px;
      overflow-y: auto;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat::-webkit-scrollbar { width: 4px; }
    .chat::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 88%;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .msg.user {
      background: #1a1a2e;
      align-self: flex-end;
      color: #a78bfa;
      border: 1px solid #2d2d4e;
    }

    .msg.agent {
      background: #0d1f17;
      align-self: flex-start;
      color: #34d399;
      border: 1px solid #1a3329;
    }

    .msg.error {
      background: #1f0d0d;
      align-self: flex-start;
      color: #f87171;
      border: 1px solid #3d1a1a;
    }

    .suggestions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 620px;
      margin-bottom: 10px;
    }

    .suggestion {
      background: #111;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.7rem;
      color: #666;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      transition: all 0.2s;
    }

    .suggestion:hover { border-color: #a78bfa; color: #a78bfa; }

    .input-row {
      display: flex;
      width: 100%;
      max-width: 620px;
      gap: 10px;
    }

    input {
      flex: 1;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      outline: none;
      transition: border 0.2s;
    }

    input:focus { border-color: #a78bfa; }

    button {
      background: #a78bfa;
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    button:hover { background: #c4b5fd; }
    button:disabled { background: #1a1a1a; color: #333; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Auto<span>Pay</span> Agent</h1>
    <p>Natural language payments on Tempo blockchain</p>
    <span class="badge">● Tempo Testnet Live</span>
  </div>

  <div class="chat" id="chat">
    <div class="msg agent">
      👋 Hey! I can execute payments on Tempo for you.<br><br>
      Try:<br>
      • "What is my balance?"<br>
      • "Send 5 AlphaUSD to 0x..."<br>
      • "Schedule 3 payments of 1 AlphaUSD to 0x..."
    </div>
  </div>

  <div class="suggestions">
    <div class="suggestion" onclick="fillInput('What is my balance?')">💰 Check balance</div>
    <div class="suggestion" onclick="fillInput('Send 5 AlphaUSD to 0x5939a7810298a18F58a517151FB265E239DE63cA')">📤 Send payment</div>
    <div class="suggestion" onclick="fillInput('Schedule 3 payments of 1 AlphaUSD to 0x5939a7810298a18F58a517151FB265E239DE63cA')">⏰ Schedule payments</div>
  </div>

  <div class="input-row">
    <input type="text" id="input" placeholder="Type a payment command..." />
    <button id="btn" onclick="sendCommand()">Send →</button>
  </div>

  <script>
    const input = document.getElementById('input');
    const btn = document.getElementById('btn');
    const chat = document.getElementById('chat');

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendCommand();
    });

    function fillInput(text) {
      input.value = text;
      input.focus();
    }

    function addMsg(text, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerHTML = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendCommand() {
      const cmd = input.value.trim();
      if (!cmd) return;

      input.value = '';
      btn.disabled = true;
      addMsg(cmd, 'user');
      addMsg('⏳ Processing...', 'agent');

      try {
        const res = await fetch('/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: cmd })
        });
        const data = await res.json();
        chat.lastChild.remove();

        if (data.error) {
          addMsg('❌ ' + data.error, 'error');
        } else {
          addMsg(data.message, 'agent');
        }
      } catch(e) {
        chat.lastChild.remove();
        addMsg('❌ Connection error', 'error');
      }

      btn.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
